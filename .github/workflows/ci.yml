name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Compile Python sources
        run: python -m compileall -q tools tests
      - name: Repository contract tests
        run: |
          python -m unittest -v \
            tests.test_repository_hygiene \
            tests.test_project_boundary \
            tests.test_external_dataset_boundary
